# Minimal docker-compose to run the Django API and the Flask model service together.
# Place this file at: test/deploy/docker-compose.yml
#
# Notes:
# - This compose file expects two Dockerfiles:
#   1) A Django Dockerfile at the repository root named `Dockerfile.django` (path relative to compose context).
#   2) A Flask model service Dockerfile at `python_model_service/Dockerfile`.
# - The Django service will talk to the model service using the service name `model` (PYTHON_API_URL=http://model:5000).
# - For development convenience this compose mounts the code into the containers. In production you should remove mounts
#   and build immutable images instead.
#
# Example usage (from the directory containing this file):
#   docker compose up --build
#   docker compose up -d --build    # run detached
#
version: "3.8"

services:
  django:
    # build from repository root (compose file is in test/deploy, so context: ..)
    build:
      context: ..
      dockerfile: deploy/Dockerfile.django
    container_name: recommender-django
    restart: unless-stopped
    env_file:
      - ../.env                # optional, load env vars if present
    environment:
      # ensure Django writes logs immediately
      PYTHONUNBUFFERED: "1"
      # Make sure Django points to the model service by default
      PYTHON_API_URL: "http://model:5000"
      # Adjust Django settings module if necessary
      DJANGO_SETTINGS_MODULE: "recommender.settings"
    ports:
      - "8000:8000"
    # Mount code for live development (optional)
    volumes:
      - ../:/app:cached
    depends_on:
      model:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - appnet

  model:
    build:
      context: ../python_model_service
      dockerfile: Dockerfile
    container_name: model-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      FLASK_ENV: development
      # optional: tune host/port inside container if your Dockerfile uses gunicorn then adapt
      PORT: "5000"
    ports:
      - "5000:5000"
    # Mount the service folder for development so feedback.csv and local model are persisted on host
    volumes:
      - ../python_model_service:/app:cached
      # If your model.pkl is at repo root and you want it available inside the model container, mount it:
      - ../model.pkl:/app/model.pkl:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - appnet

# Optional: add a simple admin/worker service in future (celery, redis, etc.)
#
# volumes:
#   db_data:
#     driver: local

networks:
  appnet:
    driver: bridge

# ---------------------------
# Helpful example Dockerfiles (create separately)
# ---------------------------
#
# Example: deploy/Dockerfile.django  (save as test/deploy/Dockerfile.django)
#
# FROM python:3.10-slim
# WORKDIR /app
# ENV PYTHONUNBUFFERED=1
# COPY requirements2.txt /app/requirements2.txt
# RUN pip install --no-cache-dir -r /app/requirements2.txt
# # Copy code (in dev you may prefer mounting instead of copying)
# COPY . /app
# # Collect static files if you use them (optional)
# # RUN python manage.py collectstatic --noinput
# EXPOSE 8000
# CMD ["gunicorn", "recommender.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3"]
#
# Example: python_model_service/Dockerfile  (save as test/python_model_service/Dockerfile)
#
# FROM python:3.10-slim
# WORKDIR /app
# ENV PYTHONUNBUFFERED=1
# COPY python_model_service/requirements.txt /app/requirements.txt
# RUN pip install --no-cache-dir -r /app/requirements.txt
# # Copy the service code (dev-friendly setups often mount this directory instead)
# COPY python_model_service /app
# EXPOSE 5000
# # In dev use the built-in Flask runner; in prod replace with gunicorn
# CMD ["python", "app.py"]
#
# Adjust the above Dockerfiles to your preferences (use gunicorn for production, pin exact versions, etc.).
#
# ---------------------------
# Notes on volumes and persistence
# ---------------------------
# - `python_model_service/feedback.csv` will be created inside the mounted volume so feedback persists on the host.
# - If you prefer not to mount the whole repo into containers, remove the `volumes:` entries and ensure Dockerfile copies sources.